[project]
name = "diffusion-style-transfer"
version = "0.1.0"
description = "Diffusion-based artistic style transfer (SDXL + InstantStyle + ControlNet-Depth) behind a Gradio UI and CLI."
requires-python = ">=3.11,<3.13"
dependencies = [
    "gradio==6.14.0",
    "diffusers==0.38.0",
    "transformers==5.8.0",
    "accelerate==1.13.0",
    "huggingface_hub==1.14.0",
    "controlnet-aux==0.0.10",
    "peft==0.19.1",
    "pillow==12.2.0",
    "numpy==2.4.4",
    "safetensors==0.8.0rc0",
    "timm==1.0.26",
]

# torch/torchvision are split into hardware extras so the right wheels resolve
# per platform. Apple Silicon (MPS) ships in the standard macOS arm64 wheel, so
# it is served by the `cpu` extra — there is no separate metal package for
# PyTorch the way there is for TensorFlow.
[project.optional-dependencies]
cpu = [
    "torch==2.11.0",
    "torchvision==0.26.0",
]
cuda = [
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
